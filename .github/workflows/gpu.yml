name: GPU hardware checks

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Registered self-hosted GPU runner label
        required: true
        type: choice
        options: [metal, cuda]
      benchmark:
        description: Also run timed GPU workloads
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gpu:
    runs-on: [self-hosted, "${{ inputs.backend }}"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.12.23
      - run: uv sync --locked
      - run: uv run python tools/build_packages.py
      - env:
          GPU_BACKEND: ${{ inputs.backend }}
          GPU_BENCHMARK: ${{ inputs.benchmark }}
        shell: bash
        run: |
          args=(--require-api "$GPU_BACKEND" --package-dir .build/packages --compiler-threads 1)
          if [[ "$GPU_BACKEND" == cuda ]]; then
            cap=$(nvidia-smi --id=0 --query-gpu=compute_cap --format=csv,noheader)
            args+=(--arch "sm_${cap//[[:space:].]/}")
          else
            args+=(--arch sm_86)
          fi
          if [[ "$GPU_BENCHMARK" == true ]]; then
            args+=(--benchmark)
          fi
          uv run python tools/check_gpu.py "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gpu-${{ inputs.backend }}
          path: |
            tests/gpu-verification.json
            .build/gpu*.log
            .build/*gpu*.log
          include-hidden-files: true
          if-no-files-found: error
